<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tài Xỉu VIP - Mobile Game GUI</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    
    body { 
      background: radial-gradient(circle at center, #1b162c 0%, #08060f 100%); 
      color: #fff; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 10px;
      overflow-x: hidden;
    }

    /* KHUNG GAME MOBILE SKEUOMORPHISM */
    .game-frame {
      background: linear-gradient(180deg, #2a223d 0%, #110d1c 100%);
      border: 3px solid #ffd700;
      border-radius: 28px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.9),
        0 0 25px rgba(255, 215, 0, 0.25),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
      position: relative;
    }

    /* HEADER: THÔNG TIN SÒNG BÀI */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #b38728;
      border-radius: 16px;
      padding: 6px 14px;
      margin-bottom: 12px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
    }
    .game-logo {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #ffe259 40%, #ffa751 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    .session-badge {
      font-size: 0.75rem;
      color: #ffd700;
      background: #000;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid #554114;
    }

    /* BÁT ĐĨA LẮC XÚC XẮC 3D (CENTERPIECE) */
    .plate-area {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 10px auto 16px auto;
      background: radial-gradient(circle, #3a2e22 0%, #140d07 100%);
      border-radius: 50%;
      border: 6px solid #d4af37;
      box-shadow: 
        0 10px 25px rgba(0,0,0,0.9),
        inset 0 0 20px rgba(0,0,0,0.9),
        0 0 15px rgba(212, 175, 55, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    /* ĐỒNG HỒ ĐẾM NGƯỢC */
    .timer-badge {
      position: absolute;
      top: -14px;
      background: linear-gradient(180deg, #ffea00, #d48800);
      border: 2px solid #fff;
      color: #000;
      font-weight: 900;
      font-size: 1.2rem;
      padding: 2px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 10px rgba(255, 234, 0, 0.6);
      z-index: 20;
    }
    .timer-badge.danger {
      background: linear-gradient(180deg, #ff4d4d, #990000);
      color: #fff;
      animation: pulseRed 0.5s infinite alternate;
    }

    /* BÁT ÚP MẠ VÀNG ĐỒNG VỚI HOA VĂN */
    .golden-bowl {
      position: absolute;
      inset: -4px;
      background: 
        radial-gradient(circle at 35% 35%, #ffe699 0%, #b8860b 50%, #4a3000 100%);
      border-radius: 50%;
      border: 5px solid #ffd700;
      box-shadow: 0 12px 30px rgba(0,0,0,0.95);
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.5s;
      cursor: pointer;
    }
    /* Hoa văn SVG chạm khắc trên bát */
    .golden-bowl::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 2px dashed rgba(255, 215, 0, 0.6);
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .golden-bowl::after {
      content: '🎲';
      font-size: 2.5rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
    }
    /* Khi Mở Bát */
    .golden-bowl.lifted {
      transform: translateY(-130px) rotate(-15deg) scale(0.85);
      opacity: 0.15;
      pointer-events: none;
    }

    /* VIÊN XÚC XẮC 3D */
    .dice-cube {
      width: 42px;
      height: 42px;
      background: linear-gradient(145deg, #ffffff 0%, #dcdcdc 100%);
      border-radius: 10px;
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2), 0 6px 12px rgba(0,0,0,0.8);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 5px;
      z-index: 5;
    }
    .dot { background: #111; border-radius: 50%; width: 7px; height: 7px; margin: auto; }
    .dot.red { background: #d32f2f; }

    /* CỬA TÀI & CỬA XỈU SÒNG BÀI */
    .betting-doors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .door-box {
      border-radius: 20px;
      padding: 14px 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: #120e1a;
      transition: all 0.3s;
    }

    /* CỬA TÀI: Đèn LED đỏ & Viền chạy */
    .door-tai {
      background: radial-gradient(circle at top, #4a0d0d 0%, #170404 100%);
      border: 3px solid #ff2a2a;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.3);
      animation: ledRedPulse 2s infinite alternate;
    }
    /* CỬA XỈU: Đèn LED xanh neon */
    .door-xiu {
      background: radial-gradient(circle at top, #0d2b4a 0%, #04101d 100%);
      border: 3px solid #00a2ff;
      box-shadow: 0 0 15px rgba(0, 162, 255, 0.3);
      animation: ledBluePulse 2s infinite alternate;
    }

    .door-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .tai-text {
      background: linear-gradient(180deg, #ffffff 0%, #ff8888 50%, #ff0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(255,0,0,0.8));
    }
    .xiu-text {
      background: linear-gradient(180deg, #ffffff 0%, #88d4ff 50%, #0088ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(0,136,255,0.8));
    }

    .sub-condition { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; }

    /* THÔNG SỐ NHẢY SỐ (COUNTER UP) */
    .stat-box {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      padding: 4px;
      margin: 4px 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .stat-label { font-size: 0.68rem; color: #888; }
    .stat-value { font-size: 0.9rem; font-weight: 900; color: #ffeb3b; }

    /* Ô NHẬP TIỀN & NÚT CƯỢC */
    .input-amount {
      width: 100%;
      background: #000;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 6px;
      text-align: center;
      margin: 8px 0;
      outline: none;
    }
    .door-tai .input-amount:focus { border-color: #ff2a2a; }
    .door-xiu .input-amount:focus { border-color: #00a2ff; }

    .btn-action {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.9rem;
      color: #fff;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .btn-action:active { transform: scale(0.95); }
    .btn-tai-act { background: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%); border: 1px solid #ff9999; }
    .btn-xiu-act { background: linear-gradient(180deg, #3399ff 0%, #0044cc 100%); border: 1px solid #99ccff; }

    /* THÀNH PHẦN CHIP CASINO TRÒN nổi 3D (KHỐI D) */
    .chips-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .casino-chip {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.4);
      border: 3px dashed #fff;
      transition: transform 0.15s;
    }
    .casino-chip:active { transform: scale(0.88); }
    
    .chip-10k { background: radial-gradient(circle, #8e24aa, #4a148c); }
    .chip-50k { background: radial-gradient(circle, #1e88e5, #0d47a1); }
    .chip-100k { background: radial-gradient(circle, #43a047, #1b5e20); }
    .chip-500k { background: radial-gradient(circle, #fb8c00, #e65100); }
    .chip-1m { background: radial-gradient(circle, #e53935, #b71c1c); }
    .chip-allin { background: radial-gradient(circle, #ffd700, #b8860b); color: #000; border-color: #000; }

    /* BẢNG SOI CẦU FOOTER */
    .history-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .bead {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 900;
      flex-shrink: 0;
    }
    .bead-T { background: #ff2a2a; color: #fff; box-shadow: 0 0 6px #ff2a2a; }
    .bead-X { background: #00a2ff; color: #fff; box-shadow: 0 0 6px #00a2ff; }

    /* HIỆU ỨNG THẮNG CƯỢC (WIN EFFECT) */
    .door-box.winner {
      animation: winFlash 0.6s infinite alternate !important;
      border-color: #ffd700 !important;
    }
    .door-box.winner .door-title {
      animation: winPulse 0.6s infinite alternate;
    }
    .door-box.winner::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(30deg);
      animation: shimmer 1s infinite;
    }

    /* ANIMATIONS KEYFRAMES */
    @keyframes ledRedPulse {
      0% { box-shadow: 0 0 10px rgba(255,42,42,0.4); }
      100% { box-shadow: 0 0 25px rgba(255,42,42,0.9); }
    }
    @keyframes ledBluePulse {
      0% { box-shadow: 0 0 10px rgba(0,162,255,0.4); }
      100% { box-shadow: 0 0 25px rgba(0,162,255,0.9); }
    }
    @keyframes pulseRed {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    @keyframes winFlash {
      0% { box-shadow: 0 0 15px #ffd700, inset 0 0 10px #ffd700; }
      100% { box-shadow: 0 0 40px #ffd700, inset 0 0 20px #ffd700; }
    }
    @keyframes winPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }
  </style>
</head>
<body>

  <div class="game-frame">
    
    <!-- HEADER -->
    <div class="header-bar">
      <div class="game-logo">HITCLUB VIP</div>
      <div class="session-badge" id="session-id">#100001</div>
    </div>

    <!-- ĐĨA LẮC & BÁT ÚP MẠ VÀNG -->
    <div class="plate-area">
      <div class="timer-badge" id="timer">30s</div>
      <div class="golden-bowl" id="bowl" onclick="manualOpenBowl()"></div>
      <div class="dice-cube" id="d1"></div>
      <div class="dice-cube" id="d2"></div>
      <div class="dice-cube" id="d3"></div>
    </div>

    <!-- CỬA ĐẶT CƯỢC -->
    <div class="betting-doors">
      <!-- Cửa TÀI -->
      <div class="door-box door-tai" id="box-tai">
        <div class="door-title tai-text">TÀI</div>
        <div class="sub-condition">11 - 17</div>
        
        <div class="stat-box">
          <div class="stat-label">TỔNG TIỀN</div>
          <div class="stat-value" id="money-tai">0đ</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">NGƯỜI ĐẶT</div>
          <div class="stat-value" id="players-tai">0</div>
        </div>

        <input type="number" class="input-amount" id="input-tai" placeholder="Nhập tiền...">
        <button class="btn-action btn-tai-act" onclick="placeBet('TAI')">Đặt Tài</button>
      </div>

      <!-- Cửa XỈU -->
      <div class="door-box door-xiu" id="box-xiu">
        <div class="door-title xiu-text">XỈU</div>
        <div class="sub-condition">4 - 10</div>

        <div class="stat-box">
          <div class="stat-label">TỔNG TIỀN</div>
          <div class="stat-value" id="money-xiu">0đ</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">NGƯỜI ĐẶT</div>
          <div class="stat-value" id="players-xiu">0</div>
        </div>

        <input type="number" class="input-amount" id="input-xiu" placeholder="Nhập tiền...">
        <button class="btn-action btn-xiu-act" onclick="placeBet('XIU')">Đặt Xỉu</button>
      </div>
    </div>

    <!-- PHỈNH CASINO NHANH -->
    <div class="chips-row">
      <div class="casino-chip chip-10k" onclick="addMoney(10000)">10K</div>
      <div class="casino-chip chip-50k" onclick="addMoney(50000)">50K</div>
      <div class="casino-chip chip-100k" onclick="addMoney(100000)">100K</div>
      <div class="casino-chip chip-500k" onclick="addMoney(500000)">500K</div>
      <div class="casino-chip chip-1m" onclick="addMoney(1000000)">1M</div>
      <div class="casino-chip chip-allin" onclick="addMoney('ALLIN')">ALL IN</div>
    </div>

    <!-- BẢNG SOI CẦU -->
    <div class="history-row" id="history-box"></div>

  </div>

  <script>
    const socket = io();
    let activeInput = 'input-tai';
    let targetTaiMoney = 0, currentTaiMoney = 0;
    let targetXiuMoney = 0, currentXiuMoney = 0;
    let isBowlOpened = false;

    document.getElementById('input-tai').addEventListener('focus', () => activeInput = 'input-tai');
    document.getElementById('input-xiu').addEventListener('focus', () => activeInput = 'input-xiu');

    function addMoney(val) {
      const input = document.getElementById(activeInput);
      if (val === 'ALLIN') {
        input.value = 50000000;
      } else {
        input.value = (parseInt(input.value) || 0) + val;
      }
    }

    function placeBet(choice) {
      const inputId = choice === 'TAI' ? 'input-tai' : 'input-xiu';
      const amount = parseInt(document.getElementById(inputId).value);
      if (!amount || amount <= 0) return alert('Vui lòng nhập tiền cược!');
      socket.emit('place_bet', { choice, amount });
      document.getElementById(inputId).value = '';
    }

    function manualOpenBowl() {
      document.getElementById('bowl').classList.add('lifted');
      isBowlOpened = true;
    }

    // Hiệu ứng số nhảy mượt (Counter-Up Animation)
    setInterval(() => {
      if (currentTaiMoney < targetTaiMoney) {
        currentTaiMoney += Math.ceil((targetTaiMoney - currentTaiMoney) / 3);
        document.getElementById('money-tai').innerText = currentTaiMoney.toLocaleString() + 'đ';
      }
      if (currentXiuMoney < targetXiuMoney) {
        currentXiuMoney += Math.ceil((targetXiuMoney - currentXiuMoney) / 3);
        document.getElementById('money-xiu').innerText = currentXiuMoney.toLocaleString() + 'đ';
      }
    }, 100);

    // Vẽ xúc xắc chấm 3D
    function renderDice(id, val) {
      const el = document.getElementById(id);
      el.innerHTML = '';
      const map = { 1: [4], 2: [0,8], 3: [0,4,8], 4: [0,2,6,8], 5: [0,2,4,6,8], 6: [0,2,3,5,6,8] };
      const active = map[val] || [];
      for(let i=0; i<9; i++) {
        const dot = document.createElement('div');
        if(active.includes(i)) dot.className = val === 1 ? 'dot red' : 'dot';
        el.appendChild(dot);
      }
    }

    socket.on('game_update', (state) => {
      document.getElementById('session-id').innerText = state.sessionId;
      
      const timerEl = document.getElementById('timer');
      timerEl.innerText = `${state.timeRemaining}s`;
      if (state.timeRemaining <= 5 && state.status === 'BETTING') {
        timerEl.classList.add('danger');
      } else {
        timerEl.classList.remove('danger');
      }

      // Cập nhật mục tiêu số tiền để chạy Counter Up
      targetTaiMoney = state.totalTai;
      targetXiuMoney = state.totalXiu;
      document.getElementById('players-tai').innerText = state.playersTai.toLocaleString();
      document.getElementById('players-xiu').innerText = state.playersXiu.toLocaleString();

      renderDice('d1', state.dice[0]);
      renderDice('d2', state.dice[1]);
      renderDice('d3', state.dice[2]);

      const boxTai = document.getElementById('box-tai');
      const boxXiu = document.getElementById('box-xiu');
      const bowl = document.getElementById('bowl');

      if (state.status === 'BETTING') {
        // Reset phiên mới
        bowl.classList.remove('lifted');
        boxTai.classList.remove('winner');
        boxXiu.classList.remove('winner');
        isBowlOpened = false;
      } else if (state.status === 'RESULT') {
        // Hết thời gian: Tự động mở bát khi còn 2 giây & Bật Win Effect
        if (state.timeRemaining <= 2 && !isBowlOpened) {
          manualOpenBowl();
        }

        const total = state.dice[0] + state.dice[1] + state.dice[2];
        if (total >= 11) {
          boxTai.classList.add('winner');
          boxXiu.classList.remove('winner');
        } else {
          boxXiu.classList.add('winner');
          boxTai.classList.remove('winner');
        }
      }

      // Render Lịch Sử Soi Cầu
      const histBox = document.getElementById('history-box');
      histBox.innerHTML = '';
      state.history.forEach(item => {
        const bead = document.createElement('div');
        bead.className = `bead bead-${item.result === 'TAI' ? 'T' : 'X'}`;
        bead.innerText = item.result === 'TAI' ? 'T' : 'X';
        histBox.appendChild(bead);
      });
    });
  </script>
</body>
</html>
