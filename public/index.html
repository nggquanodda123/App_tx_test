<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tài Xỉu Casino VIP</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    
    /* 1. Phong cách thiết kế tổng thể */
    body { 
      background: #0d0f1d; 
      color: #fff; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 10px;
    }

    .casino-panel {
      background: #16192b;
      border: 2px solid #20253d;
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.15);
      position: relative;
    }

    /* KHỐI A: Tiêu đề & Phiên cược */
    .header-block { text-align: center; margin-bottom: 12px; }
    .game-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffe066 0%, #f5af19 50%, #e65c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(245, 175, 25, 0.4));
      text-transform: uppercase;
    }
    .session-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      color: #a0a5c0;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 2px;
    }

    /* KHỐI B: Đĩa lắc xúc xắc */
    .centerpiece {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 10px auto 15px auto;
      background: radial-gradient(circle, #2a2e45 0%, #121420 100%);
      border: 4px solid #d4af37;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3), inset 0 0 15px #000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    /* Đồng hồ đếm ngược */
    .timer-badge {
      position: absolute;
      top: -12px;
      background: #16192b;
      border: 2px solid #ffeb3b;
      color: #ffeb3b;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 2px 14px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(255, 235, 59, 0.4);
      z-index: 5;
    }
    .timer-badge.warning {
      color: #ff2a2a;
      border-color: #ff2a2a;
      animation: blinkRed 0.6s infinite alternate;
    }

    /* Xúc xắc 3D */
    .dice-3d {
      width: 38px;
      height: 38px;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 0 4px rgba(0,0,0,0.1);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 5px;
    }
    .dot { background: #222; border-radius: 50%; width: 6px; height: 6px; margin: auto; }
    .dot.red { background: #ff2a2a; }

    /* KHỐI C: Cửa đặt cược 50-50 */
    .betting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    
    .bet-column {
      background: rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 10px;
      transition: all 0.3s;
      text-align: center;
    }

    /* Hiệu ứng Hover phát sáng */
    .bet-column.tai-side:hover {
      border-color: #ff2a2a;
      box-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
    }
    .bet-column.xiu-side:hover {
      border-color: #00a2ff;
      box-shadow: 0 0 20px rgba(0, 162, 255, 0.5);
    }

    .door-title { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; }
    .tai-title { color: #ff2a2a; text-shadow: 0 0 12px rgba(255, 42, 42, 0.6); }
    .xiu-title { color: #00a2ff; text-shadow: 0 0 12px rgba(0, 162, 255, 0.6); }
    .win-condition { font-size: 0.75rem; color: #8a8fa8; margin-bottom: 8px; }

    .stat-row { font-size: 0.78rem; color: #b0b5d0; margin: 3px 0; text-align: left; display: flex; justify-content: space-between; }
    .stat-val { font-weight: bold; color: #ffeb3b; }

    /* Input Box */
    .bet-input {
      width: 100%;
      background: #0d0f1d;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      margin: 8px 0;
      outline: none;
      text-align: center;
      transition: border-color 0.3s;
    }
    .tai-side .bet-input:focus { border-color: #ff2a2a; box-shadow: 0 0 8px rgba(255,42,42,0.4); }
    .xiu-side .bet-input:focus { border-color: #00a2ff; box-shadow: 0 0 8px rgba(0,162,255,0.4); }

    /* Action Buttons */
    .btn-bet {
      width: 100%;
      padding: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn-bet:active { transform: scale(0.96); }
    .btn-tai { background: linear-gradient(135deg, #ff2a2a, #990000); box-shadow: 0 4px 12px rgba(255,42,42,0.3); }
    .btn-xiu { background: linear-gradient(135deg, #00a2ff, #0052cc); box-shadow: 0 4px 12px rgba(0,162,255,0.3); }

    /* KHỐI D: Thanh chọn tiền nhanh */
    .quick-chips { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .chip-btn {
      flex: 0 0 auto;
      background: #20253d;
      border: 1px solid #d4af37;
      color: #ffd700;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .chip-btn:active { background: #d4af37; color: #000; }

    /* KHỐI E: Bảng thống kê lịch sử cầu */
    .roadmap-title { font-size: 0.75rem; color: #7a809b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .roadmap-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .road-dot {
      flex: 0 0 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
    }
    .road-T { background: #ff2a2a; box-shadow: 0 0 6px rgba(255,42,42,0.6); }
    .road-X { background: #00a2ff; box-shadow: 0 0 6px rgba(0,162,255,0.6); }

    /* ANIMATIONS */
    .shake-animation { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    @keyframes blinkRed {
      0% { box-shadow: 0 0 5px #ff2a2a; }
      100% { box-shadow: 0 0 18px #ff2a2a; }
    }
  </style>
</head>
<body>

  <div class="casino-panel">
    
    <!-- KHỐI A -->
    <div class="header-block">
      <div class="game-title">TÀI XỈU</div>
      <div class="session-badge" id="session-id">Phiên: #100001</div>
    </div>

    <!-- KHỐI B -->
    <div class="centerpiece" id="plate">
      <div class="timer-badge" id="timer">30s</div>
      <div class="dice-3d" id="d1"></div>
      <div class="dice-3d" id="d2"></div>
      <div class="dice-3d" id="d3"></div>
    </div>

    <!-- KHỐI C -->
    <div class="betting-grid">
      <!-- Cột TÀI -->
      <div class="bet-column tai-side">
        <div class="door-title tai-title">TÀI</div>
        <div class="win-condition">(11 - 17)</div>
        <div class="stat-row">Tiền: <span class="stat-val" id="total-tai">0đ</span></div>
        <div class="stat-row">Người đặt: <span class="stat-val" id="players-tai">0</span></div>
        <input type="number" class="bet-input" id="input-tai" placeholder="Số tiền cược...">
        <button class="btn-bet btn-tai" onclick="bet('TAI')">ĐẶT CƯỢC TÀI</button>
      </div>

      <!-- Cột XỈU -->
      <div class="bet-column xiu-side">
        <div class="door-title xiu-title">XỈU</div>
        <div class="win-condition">(4 - 10)</div>
        <div class="stat-row">Tiền: <span class="stat-val" id="total-xiu">0đ</span></div>
        <div class="stat-row">Người đặt: <span class="stat-val" id="players-xiu">0</span></div>
        <input type="number" class="bet-input" id="input-xiu" placeholder="Số tiền cược...">
        <button class="btn-bet btn-xiu" onclick="bet('XIU')">ĐẶT CƯỢC XỈU</button>
      </div>
    </div>

    <!-- KHỐI D -->
    <div class="quick-chips">
      <button class="chip-btn" onclick="addMoney(1000)">1K</button>
      <button class="chip-btn" onclick="addMoney(10000)">10K</button>
      <button class="chip-btn" onclick="addMoney(50000)">50K</button>
      <button class="chip-btn" onclick="addMoney(100000)">100K</button>
      <button class="chip-btn" onclick="addMoney(500000)">500K</button>
      <button class="chip-btn" onclick="addMoney(1000000)">1M</button>
      <button class="chip-btn" onclick="addMoney(10000000)">10M</button>
      <button class="chip-btn" style="border-color:#ff2a2a; color:#ff2a2a;" onclick="addMoney('ALLIN')">TẤT TAY</button>
    </div>

    <!-- KHỐI E -->
    <div class="roadmap-title">Lịch Sử Cầu</div>
    <div class="roadmap-container" id="roadmap"></div>

  </div>

  <script>
    const socket = io();
    let activeInput = 'input-tai';

    document.getElementById('input-tai').addEventListener('focus', () => activeInput = 'input-tai');
    document.getElementById('input-xiu').addEventListener('focus', () => activeInput = 'input-xiu');

    function addMoney(val) {
      const input = document.getElementById(activeInput);
      if (val === 'ALLIN') {
        input.value = 50000000;
      } else {
        input.value = (parseInt(input.value) || 0) + val;
      }
    }

    function bet(choice) {
      const inputId = choice === 'TAI' ? 'input-tai' : 'input-xiu';
      const amount = parseInt(document.getElementById(inputId).value);
      if (!amount || amount <= 0) return alert('Vui lòng nhập số tiền cược!');
      
      socket.emit('place_bet', { choice, amount });
      document.getElementById(inputId).value = '';
    }

    // Render xúc xắc dạng chấm
    function renderDiceDots(elId, value) {
      const el = document.getElementById(elId);
      el.innerHTML = '';
      const dotMaps = {
        1: [4],
        2: [0, 8],
        3: [0, 4, 8],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8]
      };
      const activeDots = dotMaps[value] || [];
      for (let i = 0; i < 9; i++) {
        const dot = document.createElement('div');
        if (activeDots.includes(i)) {
          dot.className = value === 1 ? 'dot red' : 'dot';
        }
        el.appendChild(dot);
      }
    }

    socket.on('game_update', (state) => {
      document.getElementById('session-id').innerText = `Phiên: ${state.sessionId}`;
      
      const timerEl = document.getElementById('timer');
      timerEl.innerText = `${state.timeRemaining}s`;
      if (state.timeRemaining <= 5 && state.status === 'BETTING') {
        timerEl.classList.add('warning');
      } else {
        timerEl.classList.remove('warning');
      }

      document.getElementById('total-tai').innerText = state.totalTai.toLocaleString() + 'đ';
      document.getElementById('total-xiu').innerText = state.totalXiu.toLocaleString() + 'đ';
      document.getElementById('players-tai').innerText = state.playersTai.toLocaleString();
      document.getElementById('players-xiu').innerText = state.playersXiu.toLocaleString();

      // Hiệu ứng lắc đĩa khi bắt đầu phiên mới
      if (state.isShaking) {
        const plate = document.getElementById('plate');
        plate.classList.add('shake-animation');
        setTimeout(() => plate.classList.remove('shake-animation'), 600);
      }

      renderDiceDots('d1', state.dice[0]);
      renderDiceDots('d2', state.dice[1]);
      renderDiceDots('d3', state.dice[2]);

      // Cập nhật soi cầu
      const roadmap = document.getElementById('roadmap');
      roadmap.innerHTML = '';
      state.history.forEach(item => {
        const dot = document.createElement('div');
        dot.className = `road-dot road-${item.result === 'TAI' ? 'T' : 'X'}`;
        dot.innerText = item.result === 'TAI' ? 'T' : 'X';
        roadmap.appendChild(dot);
      });
    });
  </script>
</body>
</html>
